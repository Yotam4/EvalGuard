[project]
name = "evalguard-api"
version = "0.0.1"
description = "EvalGuard server: FastAPI ingestion + read-side for runs pushed from the CLI."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "EvalGuard contributors" }]
dependencies = [
  "fastapi>=0.118",
  "uvicorn>=0.30",
  "pydantic>=2.7",
]

[project.scripts]
evalguard-api = "evalguard_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalguard_api"]
