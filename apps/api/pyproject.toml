[project]
name = "evalguard-api"
version = "0.0.1"
description = "EvalGuard server: FastAPI ingestion + read-side for runs pushed from the CLI."
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "EvalGuard contributors" }]
dependencies = [
  "fastapi>=0.118",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  # PROXY-2: the invoke endpoint loads the project's stored
  # ``evalguard.yaml`` and resolves providers / evaluators via the
  # same registry the CLI uses, so a config that ran in CI runs the
  # same way through the proxy. ``pyyaml`` parses the stored blob.
  "evalguard-evaluators",
  "pyyaml>=6.0",
  # PROXY-3 Slice B: async evaluator dispatch.  Arq is small and
  # pure-Python; it pulls in ``redis``.  The dep is hard so the
  # worker module always imports cleanly; the API only opens an
  # actual pool when ``EVALGUARD_REDIS_URL`` is set.
  "arq>=0.25",
]

[project.optional-dependencies]
# Postgres deployments install ``evalguard-api[postgres]`` to pull in
# psycopg3.  SQLite-only deployments stay slim — the default install
# only carries SQLAlchemy + Alembic, both pure Python.
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
evalguard-api = "evalguard_api.main:run"
# Async evaluator worker — dequeues ``run_async_evaluator`` jobs
# the API enqueued from ``/invoke`` when an evaluator was tagged
# ``dispatch: async``.  Requires ``EVALGUARD_REDIS_URL`` set.
evalguard-evaluator-worker = "evalguard_api.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalguard_api"]
