; Alembic configuration for the EvalGuard API server.
;
; The DATABASE_URL is read from the EVALGUARD_DATABASE_URL env var
; in evalguard_api/migrations/env.py — keeping it out of this file
; means a single config works across local SQLite, staging Postgres,
; and prod Postgres without per-deployment edits.

[alembic]
script_location = evalguard_api/migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
