# Example workflow: run EvalGuard on PRs (with baseline diff) and on
# pushes to main (saving a baseline artifact for PRs to compare against).
#
# Drop this in ``.github/workflows/evalguard.yml`` in your own repo and
# adapt the ``config:`` / paths to match your project.

name: EvalGuard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download baseline (PR runs)
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: evalguard.yml
          branch: main
          name: evalguard-baseline
          path: ./.baseline
        continue-on-error: true

      - name: Run EvalGuard
        id: evalguard
        uses: ./packages/action
        with:
          config: examples/quickstart-summarizer/evalguard.yaml
          baseline: ${{ github.event_name == 'pull_request' && './.baseline/baseline.json' || '' }}
          save_baseline: ${{ github.ref == 'refs/heads/main' && './baseline.json' || '' }}

      - name: Upload baseline (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: evalguard-baseline
          path: ./baseline.json
          retention-days: 30
