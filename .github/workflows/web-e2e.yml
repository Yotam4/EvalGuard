# Phase 2.6d — Playwright e2e for the EvalGuard UI.
#
# Cheaper alternative than full server-side e2e: each test mocks the
# API responses via ``page.route()`` so the workflow doesn't have to
# boot the FastAPI.  The vitest suite (run by ``web-test.yml`` /
# locally) covers the API client URL contracts; this workflow covers
# the rendered DOM + click-through paths.
#
# Triggers on changes that could affect the bundle.  Path filter
# keeps Python-only PRs from paying the Chromium-install cost.

name: web-e2e

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/web-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install deps
        run: npm ci

      # Playwright needs Chromium + a few system libs.  The
      # ``--with-deps`` flag handles the apt install.
      # Cache the browser tarball across runs so we only download
      # ~120 MB the first time per cache key.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build static export
        # The Playwright webServer config runs ``npx serve out``;
        # ``out/`` must exist before tests start.
        run: npm run build

      - name: Run Playwright tests
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
