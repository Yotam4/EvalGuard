[project]
name = "evalguard-workspace"
version = "0.0.1"
description = "EvalGuard monorepo workspace root."
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/cli", "packages/evaluators", "apps/api"]

[tool.uv.sources]
evalguard = { workspace = true }
evalguard-evaluators = { workspace = true }
evalguard-api = { workspace = true }

# Dev-only deps for the test suite.  Not part of any package's
# runtime install — ``uv sync --group dev`` (or default ``uv sync``,
# which includes the group by default) pulls them in.  Pinning the
# minimums keeps CI reproducible without locking the floor too high.
[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23", # asyncio_mode = "strict" needs the plugin
  "httpx>=0.27", # FastAPI TestClient transport
  "jsonschema>=4.21", # schema-drift canaries
  "fakeredis>=2.36.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"
