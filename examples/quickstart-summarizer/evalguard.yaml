version: 1
project: quickstart-summarizer
template: text_gen

providers:
  # Default: offline deterministic provider. Swap to `openai`, `ollama`,
  # or any OpenAI-compatible local server by editing this block.
  - id: mock:fake-summary
    config:
      mode: json_summary

prompts:
  - id: summarize_v1
    file: prompts/summarize.md

datasets:
  - id: news_golden
    file: datasets/news.jsonl

heuristics:
  - type: json_schema
    schema_file: schemas/summary.json
  - type: length
    max: 600
    unit: chars
  - type: not_contains
    value: "As an AI"

judges:
  - id: helpfulness_v3
    type: mock_pointwise   # offline judge with a fixed score for reproducibility
    score: 4.5
    threshold: 4.0

# Layer-interaction policy. With ``short_circuit_blocking_only`` (the
# default), a row that fails a block-severity gate at an earlier layer
# skips the expensive judge calls for later layers — saving real $ in CI.
run_mode: short_circuit_blocking_only

# Per-layer gates. Each pyramid step has its own controllable gate
# with severity ``block`` | ``warn`` | ``log``.
layers:
  heuristics:                       # Layer 1 — structural correctness
    severity: block
    aggregation: pass_rate
    threshold: { min: 1.0 }         # zero tolerance for format errors

  judge_offline:                    # Layer 3 — quality rubric on golden set
    severity: block
    aggregation: pass_rate_by_tag
    threshold:
      min: 0.90
      per_tag_overrides:
        normal: 0.95
        edge:   0.80                # adversarial cases get more slack

cache:
  dir: .evalguard/cache
  enabled: true

concurrency: 4
