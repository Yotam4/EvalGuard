version: 1
project: my-project
template: text_gen

providers:
  - id: mock:default
    config: { mode: json_summary }
  # Real providers — uncomment and configure as needed:
  # - id: openai:gpt-4o-mini
  # - id: ollama:llama3.2:3b
  #   config: { base_url: http://localhost:11434 }
  # - id: openai:llama3.2:3b
  #   config: { base_url: http://localhost:11434/v1 }

prompts:
  - id: default
    file: prompts/main.md

datasets:
  - id: golden
    file: datasets/golden.jsonl

heuristics:
  - type: length
    max: 1000
  - type: not_contains
    value: "As an AI"

judges:
  - id: quality
    type: mock_pointwise
    score: 4.5
    threshold: 4.0

run_mode: short_circuit_blocking_only

layers:
  heuristics:
    severity: block
    aggregation: pass_rate
    threshold: { min: 1.0 }

  judge_offline:
    severity: block
    aggregation: pass_rate
    threshold: { min: 0.90 }

cache: { dir: .evalguard/cache, enabled: true }
concurrency: 4
