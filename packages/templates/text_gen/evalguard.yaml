version: 1
project: my-project
template: text_gen

# ── Providers ────────────────────────────────────────────────────────────────
# Every value under ``config`` is forwarded to the SDK call. ${ENV} works
# anywhere in this file.
providers:
  - id: mock:default
    config: { mode: json_summary }
  # Real options:
  # - id: openai:gpt-4o-mini
  #   config:
  #     api_key: ${OPENAI_API_KEY}
  #     temperature: 0.2
  #     max_tokens: 512
  # - id: openai:llama3.2:3b
  #   config:
  #     base_url: ${OLLAMA_BASE_URL:-http://localhost:11434/v1}
  #     temperature: 0.0

prompts:
  - id: default
    file: prompts/main.md

datasets:
  - id: golden
    file: datasets/golden.jsonl

# ── Heuristics (Layer 1) ─────────────────────────────────────────────────────
heuristics:
  - type: length
    max: 1000
  - type: not_contains
    value: "As an AI"

# ── LLM judge (Layer 3) ─────────────────────────────────────────────────────
judges:
  - id: quality
    type: mock_pointwise
    score: 4.5
    threshold: 4.0

run_mode: short_circuit_blocking_only

# ── Gates ────────────────────────────────────────────────────────────────────
layers:
  heuristics:
    severity: block
    aggregation: pass_rate
    threshold: { min: 1.0 }

  judge_offline:
    severity: block
    aggregation: pass_rate
    threshold: { min: 0.90 }

  # Custom gate via Python (escape hatch). Module path can be ``pkg.mod:fn``
  # or ``pkg.mod.fn``. The function receives (metrics, config) and returns
  # ``{"passed": bool, "details": [{...}]}``.
  #
  # human:
  #   severity: log
  #   custom_check:
  #     module: my_evals.gates:promote_disagreements
  #     config: { destination: ./goldens/candidates.jsonl }

cost_cap_usd: 5.00
concurrency: 4

cache: { dir: .evalguard/cache, enabled: true }
