version: 1
project: my-text-to-sql-project
template: text_to_sql

# ── Providers ────────────────────────────────────────────────────────────────
# Compare candidates side-by-side on the same question set. The mock
# provider's ``fixed`` mode returns a canned ``output``; individual rows
# can override the canned output by setting their own ``params: { output: ... }``
# (see datasets/golden.jsonl) so the smoke run produces real SQL per row.
providers:
  - id: mock:sql-strong
    config:
      mode: fixed
      output: "SELECT 1;"
  # - id: openai:gpt-4o-mini
  #   config:
  #     api_key: ${OPENAI_API_KEY}
  #     temperature: 0.0
  #     response_format: { type: text }

# ── Systems (shadow DB) ──────────────────────────────────────────────────────
# Top-level ``systems:`` is the configurable slot any evaluator can reference
# via ``system: <name>`` (resolved at YAML-load time so the evaluator's
# ``version_id`` covers the binding). ``${ENV}`` substitution keeps
# credentials out of the repo.
#
# The default shadow URL is a local SQLite file so the template runs with
# zero infrastructure. Point it at a throwaway Postgres / MySQL when the
# corresponding plugin is installed.
systems:
  shadow:
    kind:    sqlite
    url:     "${SHADOW_DB_URL:-sqlite:///./.evalguard/shadow.db}"
    dialect: sqlite               # set to postgres/mysql/snowflake when you swap kind
    schema:  schemas/db.sql       # DDL bootstrapped before each row's evaluation

prompts:
  - id: text2sql_v1
    file: prompts/text2sql.md

datasets:
  - id: questions
    file: datasets/golden.jsonl

# ── Layer 1 — heuristics ────────────────────────────────────────────────────
# Three layered checks, cheap → expensive:
#   1. parses         — sqlglot syntactic validation (no DB)
#   2. dry_run        — does it execute against the shadow DB?
#   3. result_match   — does it return the same result set as the expected SQL?
#
# ``sql_parses`` requires the [textsql] extra:
#     pip install 'evalguard-evaluators[textsql]'
# ``dry_run_on_shadow_db`` and ``result_set_equivalence`` use stdlib sqlite3
# for the default ``kind: sqlite`` system — no extra install needed.
heuristics:
  - id: parses
    type: sql_parses
    dialect: sqlite
    strip_fences: true
    require_select: true
  - id: dry_run
    type: dry_run_on_shadow_db
    system: shadow
  - id: result_match
    type: result_set_equivalence
    system: shadow
    ordered: false              # compare as multiset; flip to true for ORDER BY tests
  - type: not_contains
    value: "DROP TABLE"          # paranoid guard against destructive output

# ── Layer 3 — query intent judge ────────────────────────────────────────────
# Pointwise judge with a SQL-specific rubric. For real eval, swap
# ``mock_pointwise`` for ``pointwise`` and point ``model:`` at a real LLM.
judges:
  - id: query_intent_match
    type: mock_pointwise
    score: 4.5
    threshold: 4.0
    # For real eval:
    # type: pointwise
    # model: openai:gpt-4o
    # rubric_file: rubrics/intent_match.md
    # params: { temperature: 0.0 }

run_mode: short_circuit_blocking_only

# ── Gates ────────────────────────────────────────────────────────────────────
layers:
  heuristics:                     # Layer 1 — must parse + execute + match
    severity: block
    aggregation: pass_rate
    threshold: { min: 1.0 }       # zero tolerance: any of the three failing → block

  judge_offline:                  # Layer 3 — intent match
    severity: block
    aggregation: pass_rate
    threshold: { min: 0.85 }

cost_cap_usd: 5.00
concurrency: 4

cache: { dir: .evalguard/cache, enabled: true }
