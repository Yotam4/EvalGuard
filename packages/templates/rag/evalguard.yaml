version: 1
project: my-rag-project
template: rag

# ── Providers ────────────────────────────────────────────────────────────────
# RAG runs typically benchmark one generator against the same
# retriever-supplied contexts. Add multiple providers to compare models on
# the same golden set. Every config value is forwarded to the SDK.
#
# The default smoke uses the ``mock`` provider with ``mode: fixed``;
# the per-row ``params.output`` in the dataset supplies a canned RAG
# answer so the deterministic metrics produce meaningful scores
# without an API key. Swap to a real provider below to evaluate
# against your model.
providers:
  - id: mock:rag-strong
    config: { mode: fixed }
  # - id: openai:gpt-4o-mini
  #   config:
  #     api_key: ${OPENAI_API_KEY}
  #     temperature: 0.0
  #     max_tokens: 512

# Prompt placeholders read from the dataset row. RAG rows carry
# ``question`` and ``contexts`` (a list of strings); see datasets/golden.jsonl.
# List values are JSON-serialized when interpolated.
prompts:
  - id: rag_v1
    file: prompts/rag.md

datasets:
  - id: rag_golden
    file: datasets/golden.jsonl

# ── Layer 1 — heuristics (cheap deterministic) ──────────────────────────────
# Catch the worst format failures before paying for retrieval-quality metrics.
heuristics:
  - type: length
    min: 1
    max: 2000
  - type: not_contains
    value: "I don't know"        # remove this if "abstain" is a valid answer

# ── Layer 2 — RAG metrics (deterministic lexical proxies for RAGAS) ─────────
# These are token-overlap proxies, NOT LLM-backed. The ``lex.`` prefix is
# load-bearing — it signals to consumers that scores are lexical and frees
# the bare names (``faithfulness``, ``answer_relevancy``, …) for a future
# LLM-backed plugin you can register under ``evalguard.evaluators``.
#
# The proxies run in <10ms / row, require no API key, and correlate well
# enough with LLM-based RAGAS for CI regression-detection. They are NOT
# calibrated for absolute thresholds — tune ``threshold`` per project.
metrics:
  - id: lex.faithfulness
    type: lex.faithfulness
    threshold: 0.3                # lexical coverage drops fast under paraphrase
  - id: lex.answer_relevancy
    type: lex.answer_relevancy
    threshold: 0.3
  - id: lex.context_precision_unranked
    type: lex.context_precision_unranked
    threshold: 0.4
    relevance_min: 0.10           # a context "counts" if ≥10% of expected_answer tokens appear in it
  - id: lex.context_recall
    type: lex.context_recall
    threshold: 0.5

# ── Layer 3 — offline LLM-as-judge (optional) ───────────────────────────────
# Uncomment to add a holistic LLM verdict on top of the proxy metrics.
# judges:
#   - id: rag_quality
#     type: pointwise
#     model: openai:gpt-4o
#     rubric_file: rubrics/rag_quality.md
#     threshold: 4.0
#     params: { temperature: 0.0 }

run_mode: short_circuit_blocking_only

# ── Gates ────────────────────────────────────────────────────────────────────
layers:
  heuristics:
    severity: block
    aggregation: pass_rate
    threshold: { min: 1.0 }

  metrics:                        # Layer 2 — RAG metrics roll-up
    severity: warn                # warn first; tighten to ``block`` when stable
    aggregation: pass_rate
    threshold: { min: 0.80 }

  # judge_offline:                # uncomment if you enabled the LLM judge above
  #   severity: block
  #   aggregation: pass_rate
  #   threshold: { min: 0.90 }

cost_cap_usd: 5.00
concurrency: 4

cache: { dir: .evalguard/cache, enabled: true }
