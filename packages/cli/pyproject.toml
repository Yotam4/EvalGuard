[project]
name = "evalguard"
version = "0.0.1"
description = "EvalGuard CLI: declarative LLM evaluation that runs locally and integrates with CI."
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "EvalGuard contributors" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "evalguard-evaluators",
]

[project.scripts]
evalguard = "evalguard_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalguard_cli"]
